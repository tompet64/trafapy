name: Live API integration tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "trafapy/**"
      - "tests/test_trafapy.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "trafapy/**"
      - "tests/test_trafapy.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

concurrency:
  group: live-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-api:
    name: Live API (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run live API checks without coverage
        run: python -m pytest tests/test_trafapy.py -m integration -v --tb=short
